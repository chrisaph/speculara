services:
  - type: web
    name: speculara-api
    runtime: docker
    branch: staging
    plan: free
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./deploy/backend.Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMMA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: ""
      - key: FRONTEND_URL
        value: https://speculara.netlify.app
      - key: SPECULARA_REQUIRE_AUTH
        value: "1"
      - key: DEMO_ACCESS_TOKEN
        generateValue: true
      - key: OPERATOR_ACCESS_TOKEN
        generateValue: true
      - key: ENABLE_REMOTE_DESKTOP
        value: "0"
      - key: SPECULARA_COLLECTOR_DATA_DIR
        value: /data/socialmonitor
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
